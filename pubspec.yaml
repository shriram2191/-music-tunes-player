name: music_tunes
description: Music Tunes — free music streaming & player with an AMOLED UI.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.9.42
  just_audio_background: ^0.0.1-beta.13
  audio_session: ^0.1.21
  file_picker: ^8.1.4
  shared_preferences: ^2.3.3
  http: ^1.2.2
  permission_handler: ^11.3.0
  google_mobile_ads: ^5.0.0
  share_plus: ^10.0.0
  in_app_review: ^2.0.0
  path_provider: ^2.1.4
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  flutter_timezone: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/music_tunes_logo.png
